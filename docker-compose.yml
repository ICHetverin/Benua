services:
  mongodb:
    image: mongo:7
    container_name: benua-mongodb
    env_file:
      - .env
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: benua
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - benua-net
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: benua-backend
    env_file:
      - .env
    environment:
      MONGO_URI: "mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@mongodb:27017/benua?authSource=admin"
    ports:
      - "8080:8080"
    volumes:
      - local_uploads:/app/local-uploads
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - benua-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: benua-frontend
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - REACT_APP_API_URL=http://localhost:8080
      - REACT_APP_YANDEX_MAPS_API_KEY=${REACT_APP_YANDEX_MAPS_API_KEY}
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    stdin_open: true
    tty: true
    depends_on:
      - backend
    networks:
      - benua-net

  frontend-admin:
    build:
      context: ./frontend-admin
      dockerfile: Dockerfile.dev
    container_name: benua-frontend-admin
    environment:
      - VITE_API_URL=http://localhost:8080
      - CHOKIDAR_USEPOLLING=true
    ports:
      - "3001:5173"
    volumes:
      - ./frontend-admin:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - benua-net

volumes:
  mongodb_data:
  local_uploads:

networks:
  benua-net:
    driver: bridge
