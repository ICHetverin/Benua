spring:
  application:
    name: backend
  jackson:
    property-naming-strategy: SNAKE_CASE
  mongodb:
    host: ${MONGO_HOST:mongodb}
    port: ${MONGO_PORT:27017}
    database: ${MONGO_DATABASE:benua}
    username: ${MONGO_USERNAME:}
    password: ${MONGO_PASSWORD:}
    authentication-database: ${MONGO_AUTH_DB:admin}
    auto-index-creation: true
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 16MB

server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3001}
  jwt:
    secret: ${JWT_SECRET:please-change-me-in-production-32chars!}
    ttl-ms: ${JWT_TTL_MS:3600000}
  s3:
    enabled: ${YC_S3_ENABLED:false}
    endpoint: ${YC_S3_ENDPOINT:https://storage.yandexcloud.net}
    region: ${YC_S3_REGION:ru-central1}
    bucket: ${YC_S3_BUCKET:}
    access-key: ${YC_S3_ACCESS_KEY:}
    secret-key: ${YC_S3_SECRET_KEY:}
    public-base-url: ${YC_S3_PUBLIC_BASE_URL:}
    # TTL presigned URL в секундах (по умолчанию 1 час)
    presigned-url-ttl-seconds: ${YC_S3_PRESIGNED_TTL:3600}
  uploads:
    max-size-mb: 15
    allowed-mime: image/jpeg,image/png,image/webp
  admin:
    bootstrap:
      username: ${ADMIN_USERNAME:admin}
      password: ${ADMIN_PASSWORD:admin}
